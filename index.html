<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<header class="nav" id="nav">

      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>

      <p class="hero-eyebrow" id="hero-eyebrow"></p>

      <p class="hero-tagline" id="hero-tagline"></p>

    <div class="section-inner">
      <div class="highlight-grid" id="highlight-grid"></div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="section-inner">
      <h2 class="section-title">About</h2>

      <h2 class="section-title">Education &amp; Certifications</h2>
      <div class="edu-grid">
        <div>
          <h3 class="subsection-title">Education</h3>
          <div id="education-list" class="edu-list"></div>
        </div>
        <div>
          <h3 class="subsection-title">Certifications</h3>
          <div id="certification-list" class="edu-list"></div>
        </div>
      </div>
    </div>

  <section class="section" id="interests-section">
    <div class="section-inner">
      <h2 class="section-title">Beyond work</h2>
      <p class="about-text" id="interests-text"></p>
    </div>

  <section class="section section-contact" id="contact">
    <div class="section-inner">
      <h2 class="section-title">Contact</h2>
      <p class="about-text">Open to Engineering Leadership, Service Delivery, and Agile Program roles. Reach out directly:</p>
      <div class="contact-grid" id="contact-grid"></div>

  <p id="footer-text"></p>
